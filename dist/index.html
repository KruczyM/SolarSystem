<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="/SolarSystem/assets/favicon-C6RwcUce.ico" type="image/x-icon" />

  <title>Orbit 🌎 - Interactive Solar System</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/": "../node_modules/three/",
        "lil-gui": "../node_modules/lil-gui/dist/lil-gui.esm.js"
      }
    }
  </script>
  <script type="module" crossorigin src="/SolarSystem/assets/index-Edj2AdaA.js"></script>
  <link rel="stylesheet" crossorigin href="/SolarSystem/assets/index-CL05zlEu.css">
</head>

<body>
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>



  <div class="app-ui" aria-label="Application controls">
    <div class="app-floating-actions">
      <div id="languageSwitch" class="app-language-switch" role="group" aria-label="Language"></div>
      <button id="muteButton" class="app-icon-button" type="button" aria-label="Toggle sound">🔇</button>
      <button
        id="menuToggle"
        class="app-icon-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="appMenu"
      >☰</button>
    </div>

    <div id="menuBackdrop" class="app-menu-backdrop" hidden></div>

    <nav id="appMenu" class="app-menu" aria-label="Main menu" aria-hidden="true">
      <div class="app-menu__handle" aria-hidden="true"></div>

      <div class="app-menu__header">
        <strong>Controls</strong>
        <button class="app-menu__close" type="button" data-action="close" aria-label="Close menu">×</button>
      </div>

      <div class="app-menu__section">
        <button type="button" data-action="reset-view">Reset view</button>
        <button type="button" data-action="toggle-labels" id="toggleLabelsButton">Hide labels</button>
        <button type="button" data-action="add-planet">➕ Add planet</button>
      </div>

      <div class="app-menu__section">
        <p class="app-menu__section-title" data-i18n="global-settings">Global settings</p>
        <div id="globalControls"></div>
      </div>

      <div class="app-menu__section">
        <p class="app-menu__section-title" data-i18n="focus-planet">Focus planet</p>
        <div id="planetQuickActions" class="planet-actions"></div>
      </div>

      <div class="app-menu__section">
        <p class="app-menu__section-title" data-i18n="planet-editor">Planet editor</p>
        <div id="planetEditor" class="planet-editor"></div>
      </div>
    </nav>
  </div>


  <footer class="music-credit">
    <span data-i18n="music-credit">Music: "Ex Machina" by Scott Buckley</span>
    (<a href="https://www.scottbuckley.com.au" target="_blank" rel="noreferrer">scottbuckley.com.au</a>)
    <span data-i18n="licensed-under">Licensed under</span>
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a>
  </footer>
</body>
</html>
