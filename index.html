<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  <title>Orbit 🌎 - Interactive Solar System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    footer {
      position: fixed;
      right: 10px;
      bottom: 5px;
      z-index: 20;

      max-width: 320px;

      color: #aaa;
      font-size: 12px;
      line-height: 1.4;
      text-align: right;

      pointer-events: auto;
    }

    footer a {
      color: #aaa;
    }

    @media (max-width: 768px) {
      footer {
        display: none;
      }
    }
  </style>
</head>

<body>
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/": "../node_modules/three/",
        "lil-gui": "../node_modules/lil-gui/dist/lil-gui.esm.js"
      }
    }
  </script>

  <script type="module" src="/src/solar-system.js"></script>

  <footer>
    Music: "Ex Machina" by Scott Buckley
    (<a href="https://www.scottbuckley.com.au" target="_blank" rel="noreferrer">scottbuckley.com.au</a>)
    Licensed under
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">
      CC BY 4.0
    </a>
  </footer>
</body>
</html>
